name: Aircraft representation diagnostic
on:
  push:
    branches: [analysis/aircraft-nominal-review-20261031]
    paths:
      - 'tools/refit_aircraft_representation_diagnostic.py'
      - '.github/workflows/aircraft-representation-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-models.txt
      - name: Isolated diagnostic dependencies
        run: |
          mkdir -p /tmp/representation-diagnostic
          git rev-parse HEAD > /tmp/representation-diagnostic/commit.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
          python -m pip check
          python -m pip freeze > /tmp/representation-diagnostic/environment.txt
      - name: Download fixed past evidence
        run: |
          curl --fail --location --retry 2 --output /tmp/records.zip https://github.com/Luyi1235/RA-LSBO/releases/download/aircraft-nominal-pilot-20261030-233225/aircraft_nominal_20261030_01_full_records.zip
          echo '35306153ceaf9f0d17d3586455d140931985f384e28b8dba93f1902095ef6bfd  /tmp/records.zip' | sha256sum --check
      - name: Refit 64 encoders, zero GP fits, zero evaluator calls
        run: |
          set -o pipefail
          python tools/refit_aircraft_representation_diagnostic.py /tmp/records.zip /tmp/representation-diagnostic/diagnostic.json 2>&1 | tee /tmp/representation-diagnostic/log.txt
          cp tools/refit_aircraft_representation_diagnostic.py /tmp/representation-diagnostic/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representation-diagnostic-${{ github.sha }}
          path: /tmp/representation-diagnostic/
          retention-days: 30
