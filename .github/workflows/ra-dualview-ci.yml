name: RA-LSBO dualview numerical and protocol tests
on:
  push:
    branches:
      - research/ra-lsbo-risk-dualview-20261101
    paths:
      - 'ra_lsbo/experiments/simplified_aircraft/dualview_*.py'
      - 'tests/test_aircraft_dualview.py'
      - '.github/workflows/ra-dualview-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: 'Agg'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original research dependencies (CPU)
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Validate new and existing model contracts
        run: |
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/dualview_optimizer.py
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/dualview_protocol.py
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/dualview_pilot.py
          python -m pytest -q tests/test_aircraft_dualview.py tests/test_ep_stability_candidate.py tests/test_risk_core_mixed_gp.py tests/test_risk_core_observations.py tests/test_aircraft_corpus_protocol.py tests/test_aircraft_corpus_optimizer.py --junitxml=dualview-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dualview-model-unit-and-regression
          path: dualview-ci.xml
          retention-days: 30
          if-no-files-found: warn
