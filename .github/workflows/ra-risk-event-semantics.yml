name: RA-LSBO PR45 risk event semantics (ZERO aircraft)
on:
  pull_request:
    paths:
      - 'confirm12/risk_event_semantics.py'
      - 'tests/test_risk_event_semantics.py'
      - 'run_ra_lsbo_risk_semantics_pycharm.py'
      - '.github/workflows/ra-risk-event-semantics.yml'
  push:
    paths:
      - 'confirm12/risk_event_semantics.py'
      - 'tests/test_risk_event_semantics.py'
      - 'run_ra_lsbo_risk_semantics_pycharm.py'
      - '.github/workflows/ra-risk-event-semantics.yml'
jobs:
  semantics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_event_semantics.py
      - run: python -m py_compile confirm12/risk_event_semantics.py run_ra_lsbo_risk_semantics_pycharm.py
