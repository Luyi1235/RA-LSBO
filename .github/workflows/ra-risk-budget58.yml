name: RA-LSBO PR58 fixed-six REAL on-policy protocol (CI pure, zero aircraft)
on:
  push:
    paths:
      - 'ra_lsbo/experiments/risk_budget58_protocol.py'
      - 'ra_lsbo/experiments/risk_budget58_runner.py'
      - 'tests/test_risk_budget58_protocol.py'
      - 'run_ra_lsbo_risk_budget58_fixed_six_pycharm.py'
      - '.github/workflows/ra-risk-budget58.yml'
  pull_request:
    paths:
      - 'ra_lsbo/experiments/risk_budget58_protocol.py'
      - 'ra_lsbo/experiments/risk_budget58_runner.py'
      - 'tests/test_risk_budget58_protocol.py'
      - 'run_ra_lsbo_risk_budget58_fixed_six_pycharm.py'
      - '.github/workflows/ra-risk-budget58.yml'
jobs:
  pure-prespecified-design:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_budget58_protocol.py tests/test_risk_budget57_anytime_audit.py tests/test_risk_budget56_report_audit.py tests/test_risk_budget54_policy.py
      - run: python -m py_compile ra_lsbo/experiments/risk_budget58_protocol.py ra_lsbo/experiments/risk_budget58_runner.py run_ra_lsbo_risk_budget58_fixed_six_pycharm.py
