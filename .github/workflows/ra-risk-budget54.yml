name: RA-LSBO PR54 budgeted dualview policy (no aircraft in CI)
on:
  push:
    paths:
      - 'ra_lsbo/experiments/discovery_stages/optimizer.py'
      - 'ra_lsbo/experiments/risk_budget54_policy.py'
      - 'ra_lsbo/experiments/risk_budget54_engine.py'
      - 'ra_lsbo/experiments/risk_budget54_runner.py'
      - 'tests/test_risk_budget54_policy.py'
      - 'run_ra_lsbo_risk_budget_math54_pycharm.py'
      - '.github/workflows/ra-risk-budget54.yml'
  pull_request:
    paths:
      - 'ra_lsbo/experiments/discovery_stages/optimizer.py'
      - 'ra_lsbo/experiments/risk_budget54_policy.py'
      - 'ra_lsbo/experiments/risk_budget54_engine.py'
      - 'ra_lsbo/experiments/risk_budget54_runner.py'
      - 'tests/test_risk_budget54_policy.py'
      - 'run_ra_lsbo_risk_budget_math54_pycharm.py'
      - '.github/workflows/ra-risk-budget54.yml'
jobs:
  pure-policy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_budget54_policy.py
      - run: python -m py_compile ra_lsbo/experiments/discovery_stages/optimizer.py ra_lsbo/experiments/risk_budget54_policy.py ra_lsbo/experiments/risk_budget54_engine.py ra_lsbo/experiments/risk_budget54_runner.py run_ra_lsbo_risk_budget_math54_pycharm.py
