name: RA-LSBO matched two-view GP mechanism (ZERO truth)
on:
  push:
    branches: [research/ra-lsbo-matched-gp-mechanism-20261104]
  pull_request:
    paths:
      - 'confirm12/matched_gp_mechanism.py'
      - 'run_ra_lsbo_matched_gp_pycharm.py'
      - 'tests/test_confirm12_matched_gp_mechanism.py'
      - '.github/workflows/ra-confirm12-matched-gp.yml'
permissions:
  contents: read
jobs:
  matched-gp-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing model dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: No-truth matched GP math and independent holdout tests
        run: |
          python -m pytest -q tests/test_confirm12_matched_gp_mechanism.py
      - name: Import PyCharm entry without starting GP training or aircraft
        run: |
          python -c "import runpy; runpy.run_path('run_ra_lsbo_matched_gp_pycharm.py',run_name='__import_check__')"
