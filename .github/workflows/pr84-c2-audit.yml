name: pr84-c2-readonly-audit
on:
  pull_request:
    paths:
      - 'pr84_c2_audit.py'
      - 'run_pr84_c2_audit.py'
      - 'tests/test_pr84_c2_audit.py'
      - 'docs/PR84_C2_READONLY_AUDIT.txt'
      - '.github/workflows/pr84-c2-audit.yml'
permissions:
  contents: read
jobs:
  standard-library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -S -m unittest discover -s tests -p test_pr84_c2_audit.py -v
      - name: Compile and CLI help
        run: |
          python -S -m compileall -q pr84_c2_audit.py run_pr84_c2_audit.py
          python -S run_pr84_c2_audit.py --help
      - name: Static read-only boundary check
        run: python -S -c "from pathlib import Path; s=Path('pr84_c2_audit.py').read_text(); forbidden=['risk_learning.core import truth','c1_native','c2_native','StableGroupedHead','def truth(']; assert not any(x in s for x in forbidden)"
