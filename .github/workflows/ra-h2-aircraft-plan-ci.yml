name: RA-LSBO-H2 new-aircraft registration preview only (zero evaluator)
on:
  push:
    branches:
      - research/ra-lsbo-h2-causal-risk-20261102
    paths:
      - ra_lsbo/experiments/simplified_aircraft/h2_*.py
      - tests/test_h2_pilot_protocol.py
      - docs/RA_LSBO_H2_PROSPECTIVE_AIRCRAFT_PROTOCOL_20261102.md
      - .github/workflows/ra-h2-aircraft-plan-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded_registration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: 'Agg'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies (never evaluate aircraft)
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: H2 registration, causal replay, exact-mixture, original GP regressions
        run: |
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/h2_protocol.py ra_lsbo/experiments/simplified_aircraft/h2_pilot.py
          python -m pytest -q tests/test_h2_pilot_protocol.py tests/test_h2_metrics.py tests/test_h2_optimizer_integration.py tests/test_h2_risk_controller.py tests/test_aircraft_dualview.py tests/test_aircraft_corpus_protocol.py tests/test_aircraft_corpus_optimizer.py --junitxml=/tmp/h2-aircraft-plan-tests.xml
      - name: Render nonauthorizing registered 48-call smoke and 1008-call pilot previews
        run: |
          mkdir -p /tmp/h2-registered-preview
          python - <<'PY'
          import json
          from pathlib import Path
          from ra_lsbo.experiments.simplified_aircraft import h2_pilot as m
          from ra_lsbo.experiments.simplified_aircraft import h2_protocol as p
          root=Path('/tmp/h2-registered-preview')
          for stage in ('smoke','pilot'):
              plan=m.build_plan(stage)
              assert plan['source_commit']
              assert plan['schema']==p.SCHEMA
              assert tuple(plan['cases'])==p.CASES
              assert tuple(plan['arms'])==p.ARMS
              assert plan['profile']['seeds']==p.PROFILES[stage]['seeds']
              assert len(plan['sources'])>=170
              assert plan['budget']['maximum_rcaide_mda_calls']==0
              assert plan['budget']['maximum_model_calls']==(48 if stage=='smoke' else 1008)
              assert plan['methods']['h2_causal']['controller']['warmup_scored']==4
              assert plan['new_rcaide_mda_calls']==0
              # Not a Windows plan; a Linux simulation cannot grant model
              # permission from this preview.
              obj={'non_authorizing_linux_preview':True,'scope':'NO model truth',
                   'registered_plan':plan}
              (root/(stage+'.json')).write_text(json.dumps(obj,sort_keys=True,indent=2,allow_nan=False)+'\n')
              print(stage,plan['budget'],len(plan['sources']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H2-M-smoke-and-pilot-nonauthorizing-source-plan
          path: |
            /tmp/h2-registered-preview/
            /tmp/h2-aircraft-plan-tests.xml
          retention-days: 60
          if-no-files-found: warn
