name: information-value-stage1
on:
  pull_request:
    paths:
      - 'ra_lsbo/experiments/information_value_stage1/**'
      - 'tests/test_information_value_stage1.py'
      - 'run_ra_lsbo_information_stage1_pycharm.py'
      - '.github/workflows/information-value-stage1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stdlib-mechanism-and-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pure tests (no real GP/VAE or evaluator)
        run: python -m unittest discover -s tests -p test_information_value_stage1.py -v
      - name: Compile new source only
        run: python -m compileall -q ra_lsbo/experiments/information_value_stage1 run_ra_lsbo_information_stage1_pycharm.py tests/test_information_value_stage1.py
