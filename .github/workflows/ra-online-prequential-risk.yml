name: RA-LSBO PR52 native online prequential risk (ZERO models)
on:
  push:
    paths:
      - 'confirm12/online_prequential_risk.py'
      - 'tests/test_online_prequential_risk.py'
      - 'run_ra_lsbo_online_risk_prequential_pycharm.py'
      - '.github/workflows/ra-online-prequential-risk.yml'
  pull_request:
    paths:
      - 'confirm12/online_prequential_risk.py'
      - 'tests/test_online_prequential_risk.py'
      - 'run_ra_lsbo_online_risk_prequential_pycharm.py'
      - '.github/workflows/ra-online-prequential-risk.yml'
jobs:
  offline-evidence-audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_online_prequential_risk.py tests/test_feasibility_risk_calibration.py tests/test_risk_event_semantics.py
      - run: python -m py_compile confirm12/online_prequential_risk.py run_ra_lsbo_online_risk_prequential_pycharm.py
