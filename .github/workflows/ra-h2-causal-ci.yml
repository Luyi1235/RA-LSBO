name: RA-LSBO-H2 causal risk controller and hierarchical censoring benchmark
on:
  push:
    branches:
      - research/ra-lsbo-h2-causal-risk-20261102
    paths:
      - 'ra_lsbo/experiments/simplified_aircraft/h2_*.py'
      - 'tests/test_ra_h2*.py'
      - '.github/workflows/ra-h2-causal-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic_causal_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: 'Agg'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original GP imports without GPU
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Run controller leak/censor/failure tests and frozen RA H regressions
        run: |
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/h2_controller.py ra_lsbo/experiments/simplified_aircraft/h2_synthetic.py
          python -m pytest -q tests/test_ra_h2_controller.py tests/test_aircraft_dualview.py tests/test_risk_core_observations.py tests/test_ep_stability_candidate.py --junitxml=/tmp/h2_tests.xml
      - name: Execute deterministic hierarchical and censored synthetic benchmark
        run: |
          python -m ra_lsbo.experiments.simplified_aircraft.h2_synthetic --output /tmp/h2-synthetic-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra-h2-causal-controller-and-synthetic-benchmark
          path: |
            /tmp/h2_tests.xml
            /tmp/h2-synthetic-benchmark/
          if-no-files-found: warn
          retention-days: 60
