name: Real 151040-aircraft runner code tests (zero physical evaluations)
on:
  push:
    branches: [research/confirm12-true-aircraft-runner-20261104]
  pull_request:
    paths:
      - 'confirm12/real_call_ledger.py'
      - 'confirm12/real_aircraft_campaign.py'
      - 'run_ra_lsbo_real_12workers_pycharm.py'
      - 'run_ra_lsbo_confirm_12workers.py'
      - 'tests/test_confirm12_real_aircraft_campaign.py'
      - '.github/workflows/ra-confirm12-true-runner-contract.yml'
permissions:
  contents: read
jobs:
  windows-production-code-contract:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen historical numerical stack
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Verify true runner construction, 151040 plan and real-record ticket contracts
        run: |
          python -m pytest -q tests/test_confirm12_real_aircraft_campaign.py tests/test_confirm12_cbob_eicb.py tests/test_confirm12_iid_lf_checkout.py tests/test_confirm12_real_candidate_engines.py
      - name: PyCharm real-launcher import must not execute evaluator
        run: |
          python -c "import runpy; runpy.run_path('run_ra_lsbo_real_12workers_pycharm.py',run_name='__import_check__')"
