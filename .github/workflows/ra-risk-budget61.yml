name: RA-LSBO PR61 forensic Beta-floor gate postmortem (NO models)
on:
  push:
    paths:
      - 'ra_lsbo/experiments/risk_budget61_gate_postmortem.py'
      - 'tests/test_risk_budget61_gate_postmortem.py'
      - 'run_ra_lsbo_risk_budget61_postmortem_pycharm.py'
      - '.github/workflows/ra-risk-budget61.yml'
  pull_request:
    paths:
      - 'ra_lsbo/experiments/risk_budget61_gate_postmortem.py'
      - 'tests/test_risk_budget61_gate_postmortem.py'
      - 'run_ra_lsbo_risk_budget61_postmortem_pycharm.py'
      - '.github/workflows/ra-risk-budget61.yml'
jobs:
  byte-pinned-no-evaluation-audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_budget61_gate_postmortem.py tests/test_risk_budget60_branch_uq.py tests/test_risk_budget59_diagnostics.py
      - run: python -m py_compile ra_lsbo/experiments/risk_budget61_gate_postmortem.py run_ra_lsbo_risk_budget61_postmortem_pycharm.py
