name: RA-LSBO-H2 P2 independent Release evidence audit (no simulator)
on:
  push:
    branches:
      - analysis/h2-p2-independent-sealed-audit-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric score dependencies (no physical models)
        run: |
          python -m pip install numpy==2.0.2 scipy==1.13.1
          python -m pip check
      - name: Download original 58 MB Release ZIP and independently audit raw evidence
        run: |
          python tools/audit_h2_p2_release_independent.py \
            --results-dir results/h2-p2-pilot-20261102 \
            --output /tmp/RA_LSBO_H2_P2_INDEPENDENT_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA-H2-P2-INDEPENDENT-SEALED-READONLY-AUDIT
          path: /tmp/RA_LSBO_H2_P2_INDEPENDENT_AUDIT.json
          retention-days: 90
          if-no-files-found: warn
