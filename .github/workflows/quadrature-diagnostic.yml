name: pr70-quadrature-diagnostic
on:
  pull_request:
    paths:
      - 'quadrature_*.py'
      - 'docs/PR72*.txt'
      - 'run_pr70_quadrature_diagnostic.py'
      - 'tests/test_quadrature_*.py'
      - '.github/workflows/quadrature-diagnostic.yml'
permissions:
  contents: read
jobs:
  exact-reference:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    defaults:
      run:
        working-directory: code
    steps:
      - name: Native reference checkout (temporary CI machine only)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf true
          git config --global core.eol crlf
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: code
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f859cca5adc56dd101d2f59665f7829a2b0331c4
          fetch-depth: 1
          path: evidence
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Temporary CI dependencies only
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Full regression tests
        run: python -m unittest discover -s tests -p 'test_quadrature_*.py' -v
      - name: Capture all 32 EXACT historical feature payloads (ZERO GP fits and true calls)
        run: python quadrature_feature_reference.py --expected-sha "${{ github.event.pull_request.head.sha }}" --evidence-root "${{ github.workspace }}/evidence" --output "${{ runner.temp }}/feature-reference"
      - name: Verify exact reference
        run: python quadrature_feature_reference.py --task verify --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/feature-reference"
      - name: Archive reference or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr72-exact-feature-reference
          path: ${{ runner.temp }}/feature-reference
          if-no-files-found: ignore
  actual-reconstruction:
    needs: exact-reference
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        checkout_eol: [lf, crlf]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    defaults:
      run:
        working-directory: code
    steps:
      - name: Explicit checkout representation
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ matrix.checkout_eol }}" = "crlf" ]; then
            git config --global core.autocrlf true
          else
            git config --global core.autocrlf false
          fi
          git config --global core.eol "${{ matrix.checkout_eol }}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: code
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f859cca5adc56dd101d2f59665f7829a2b0331c4
          fetch-depth: 1
          path: evidence
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr72-exact-feature-reference
          path: ${{ runner.temp }}/feature-reference
      - name: Temporary CI dependencies only
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Stdlib reference regression tests
        run: python -S -m unittest discover -s tests -p test_quadrature_reference.py -v
      - name: Full numerical and runtime tests
        run: python -m unittest discover -s tests -p 'test_quadrature_*.py' -v
      - name: Syntax
        run: python -m compileall -q quadrature_feature_reference.py run_pr70_quadrature_diagnostic.py
      - name: Same-state four-case reconstruction with exact normalization reference
        run: python run_pr70_quadrature_diagnostic.py --profile smoke --expected-sha "${{ github.event.pull_request.head.sha }}" --evidence-root "${{ github.workspace }}/evidence" --feature-reference "${{ runner.temp }}/feature-reference" --output "${{ runner.temp }}/quadrature-smoke"
      - name: Read-only reconciliation
        run: python run_pr70_quadrature_diagnostic.py --task verify --input "${{ runner.temp }}/quadrature-smoke"
      - name: Save full replay evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadrature-r2-${{ matrix.os }}-${{ matrix.checkout_eol }}
          path: ${{ runner.temp }}/quadrature-smoke
          if-no-files-found: ignore
