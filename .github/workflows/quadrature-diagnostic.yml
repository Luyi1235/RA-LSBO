name: pr70-quadrature-diagnostic
on:
  pull_request:
    paths:
      - 'quadrature_audit_*.py'
      - 'quadrature_source_identity.py'
      - 'quadrature_checkpoint_features.py'
      - 'docs/PR72_SOURCE_IDENTITY_R1.txt'
      - 'run_pr70_quadrature_diagnostic.py'
      - 'tests/test_quadrature_*.py'
      - '.github/workflows/quadrature-diagnostic.yml'
permissions:
  contents: read
jobs:
  actual-reconstruction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        checkout_eol: [lf, crlf]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    defaults:
      run:
        working-directory: code
    steps:
      - name: Set explicit checkout representation before fetching sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ matrix.checkout_eol }}" = "crlf" ]; then
            git config --global core.autocrlf true
          else
            git config --global core.autocrlf false
          fi
          git config --global core.eol "${{ matrix.checkout_eol }}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: code
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f859cca5adc56dd101d2f59665f7829a2b0331c4
          fetch-depth: 1
          path: evidence
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Temporary CI dependencies only
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Stdlib identity regression tests
        run: python -S -m unittest discover -s tests -p test_quadrature_identity.py -v
      - name: Numerical and REAL EP runtime tests
        run: python -m unittest discover -s tests -p 'test_quadrature_*.py' -v
      - name: Syntax
        run: python -m compileall -q quadrature_audit_protocol.py quadrature_audit_numeric.py run_pr70_quadrature_diagnostic.py quadrature_source_identity.py quadrature_checkpoint_features.py
      - name: Same-state four-case checkpoint reconstruction (ZERO true calls)
        run: python run_pr70_quadrature_diagnostic.py --profile smoke --expected-sha "${{ github.event.pull_request.head.sha }}" --evidence-root "${{ github.workspace }}/evidence" --output "${{ runner.temp }}/quadrature-smoke"
      - name: Read-only reconciliation
        run: python run_pr70_quadrature_diagnostic.py --task verify --input "${{ runner.temp }}/quadrature-smoke"
      - name: Save raw diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quadrature-r1-${{ matrix.os }}-${{ matrix.checkout_eol }}
          path: ${{ runner.temp }}/quadrature-smoke
          if-no-files-found: ignore
