name: Comparison reliability

on:
  push:
    branches: [fix/comparison-reliability-20261028]
    paths:
      - 'ra_lsbo/**'
      - 'tests/**'
      - 'requirements-models.txt'
      - 'docs/COMPARISON_RELIABILITY_REVISION_20261028.md'
      - '.github/workflows/comparison-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-models.txt
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          mkdir -p runs/ci_validation
          python -m pip freeze > runs/ci_validation/environment.txt
      - name: Targeted regression tests
        run: |
          python -m pytest -q tests/test_numerical_safeguards.py tests/test_external_comparison.py tests/test_comparison_reliability.py tests/test_comparison_entrypoints.py tests/test_comparison_visualization.py tests/test_paper_experiments.py tests/test_grouped_partial_gp.py --junitxml=runs/ci_validation/pytest.xml
      - name: Mathematical smoke only (112-call ceiling, no MDA)
        run: |
          python -m ra_lsbo.experiments.mathematical_benchmarks.compare prepare --profile smoke --output runs/ci_math_smoke
          python -m ra_lsbo.experiments.mathematical_benchmarks.compare run --output runs/ci_math_smoke --approved-call-limit 112
          python -m ra_lsbo.experiments.mathematical_benchmarks.compare audit --output runs/ci_math_smoke
          python -m ra_lsbo.experiments.mathematical_benchmarks.compare report --output runs/ci_math_smoke
      - name: Aircraft smoke only (108-call ceiling, no MDA)
        run: |
          python -m ra_lsbo.experiments.simplified_aircraft.compare prepare --profile smoke --output runs/ci_aircraft_smoke
          python -m ra_lsbo.experiments.simplified_aircraft.compare run --output runs/ci_aircraft_smoke --approved-call-limit 108
          python -m ra_lsbo.experiments.simplified_aircraft.compare audit --output runs/ci_aircraft_smoke
          python -m ra_lsbo.experiments.simplified_aircraft.compare report --output runs/ci_aircraft_smoke
      - name: Validation summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def escape(text):
              return str(text).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          report = Path('runs/ci_validation/pytest.xml')
          if report.exists():
              suites = ET.parse(report).getroot()
              counts = {key: sum(int(suite.get(key, 0)) for suite in suites.iter('testsuite'))
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              print('::notice title=Regression counts::'+json.dumps(counts))
              for case in suites.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for error in case.findall(kind):
                          print('::error title='+escape(case.get('name'))+'::'+escape((error.text or error.get('message', ''))[-6000:]))
          for name in ('math', 'aircraft'):
              folder = Path('runs/ci_'+name+'_smoke')
              if (folder/'results.json').exists():
                  result = json.loads((folder/'results.json').read_text())
                  passed = (folder/'audit.json').exists() and json.loads((folder/'audit.json').read_text())['passed']
                  print('::notice title='+name+' smoke::'+json.dumps({
                      'calls': result['charged_model_calls'], 'maximum': result['maximum_model_calls'],
                      'audit_passed': passed, 'new_rcaide_mda_calls': result['new_rcaide_mda_calls']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-validation-${{ github.sha }}
          retention-days: 7
          path: |
            runs/ci_validation/pytest.xml
            runs/ci_validation/environment.txt
            runs/ci_math_smoke/results.json
            runs/ci_math_smoke/audit.json
            runs/ci_math_smoke/report.md
            runs/ci_aircraft_smoke/results.json
            runs/ci_aircraft_smoke/audit.json
            runs/ci_aircraft_smoke/report.md
