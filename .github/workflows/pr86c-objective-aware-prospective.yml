name: pr86c-objective-aware-prospective
on:
  pull_request:
    paths:
      - 'pr86c_*.py'
      - 'run_pr86c.py'
      - 'tests/test_pr86c.py'
      - 'docs/PR86_C_OBJECTIVE_AWARE_PROSPECTIVE.txt'
      - '.github/workflows/pr86c-objective-aware-prospective.yml'
permissions:
  contents: read
concurrency:
  group: pr86c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Pure protocol, objective contract and acquisition tests
        run: python -S -m unittest discover -s tests -p test_pr86c.py -v
      - name: CPU model dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Frozen native risk-head regression
        run: python -m unittest discover -s tests -p test_c1_native.py -v
      - name: Compile and preregistration plan
        run: |
          python -m compileall -q pr86c_protocol.py pr86c_evaluator.py pr86c_models.py pr86c_acquisition.py pr86c_study.py pr86c_verify.py pr86c_analysis.py run_pr86c.py
          python -S run_pr86c.py --task plan --profile full
      - name: PR86-C prospective native integration on released tasks
        run: python run_pr86c.py --task run --profile ci --expected-sha "${{ github.event.pull_request.head.sha }}" --output "${{ runner.temp }}/pr86c-evidence/ci"
      - name: Enforce objective and risk head budgets
        run: python -S -c "import json,pathlib; r=json.loads(pathlib.Path(r'${{ runner.temp }}/pr86c-evidence/ci/report.json').read_text()); b=r['bill']; assert r['status']=='COMPLETE_PR86C_OBJECTIVE_AWARE' and b['math_started']==272 and b['math_settled']==272 and b['gp_head_errors']==0 and b['gp_kernel_errors']==0 and b['objective_gp_head_errors']==0 and b['objective_gp_kernel_errors']==0"
      - name: Independent replay verification and analysis
        run: |
          python -S run_pr86c.py --task verify --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/pr86c-evidence/ci"
          python -S run_pr86c.py --task analyze --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/pr86c-evidence/ci" --output "${{ runner.temp }}/pr86c-evidence/analysis"
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr86c-${{ matrix.os }}
          path: ${{ runner.temp }}/pr86c-evidence
          if-no-files-found: ignore
  cross-python:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr86c-windows-latest
          path: ${{ runner.temp }}/pr86c-cross
      - name: Independent Python 3.13 verify and analyze
        run: |
          python -S run_pr86c.py --task verify --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/pr86c-cross/ci"
          python -S run_pr86c.py --task analyze --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/pr86c-cross/ci" --output "${{ runner.temp }}/pr86c-cross/analysis-py313"
