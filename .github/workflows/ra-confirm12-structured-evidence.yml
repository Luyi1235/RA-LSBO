name: Confirm12 structured DesignRecord ledger, zero truth
on:
  push:
    branches: [research/confirm12-structured-evidence-ledger-20261103]
  pull_request:
    paths:
      - 'confirm12/structured_record_ledger.py'
      - 'tests/test_confirm12_structured_record_ledger.py'
      - 'confirm12/offline_ledger_trial.py'
      - 'tests/test_confirm12_offline_ledger_trial.py'
      - 'tests/test_confirm12_real_onehot_gp_offline.py'
      - '.github/workflows/ra-confirm12-structured-evidence.yml'
permissions:
  contents: read
jobs:
  windows-structured-records:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      CONFIRM12_TEST_GP_ONEHOT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original requirements
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Test structured records and existing real H1 adapter
        run: |
          python -m pytest -q tests/test_confirm12_structured_record_ledger.py tests/test_confirm12_offline_ledger_trial.py tests/test_confirm12_real_onehot_gp_offline.py tests/test_confirm12_offline_historical_trial.py tests/test_confirm12_real_legacy_adapters.py tests/test_confirm12_nested_seed_plan.py
