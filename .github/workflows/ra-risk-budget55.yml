name: RA-LSBO PR55 independent risk-budget protocol (no aircraft/GP in CI)
on:
  push:
    paths:
      - 'ra_lsbo/experiments/risk_budget55_protocol.py'
      - 'ra_lsbo/experiments/risk_budget55_runner.py'
      - 'tests/test_risk_budget55_protocol.py'
      - 'ra_lsbo/experiments/risk_budget56_report_audit.py'
      - 'tests/test_risk_budget56_report_audit.py'
      - 'run_ra_lsbo_risk_budget55_pycharm.py'
      - '.github/workflows/ra-risk-budget55.yml'
  pull_request:
    paths:
      - 'ra_lsbo/experiments/risk_budget55_protocol.py'
      - 'ra_lsbo/experiments/risk_budget55_runner.py'
      - 'tests/test_risk_budget55_protocol.py'
      - 'ra_lsbo/experiments/risk_budget56_report_audit.py'
      - 'tests/test_risk_budget56_report_audit.py'
      - 'run_ra_lsbo_risk_budget55_pycharm.py'
      - '.github/workflows/ra-risk-budget55.yml'
jobs:
  frozen-math-protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Pure protocol and inherited PR54 policy tests (no model fitting)
        run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_budget55_protocol.py tests/test_risk_budget54_policy.py tests/test_risk_budget56_report_audit.py
      - run: python -m py_compile ra_lsbo/experiments/risk_budget55_protocol.py ra_lsbo/experiments/risk_budget55_runner.py ra_lsbo/experiments/risk_budget56_report_audit.py run_ra_lsbo_risk_budget55_pycharm.py
