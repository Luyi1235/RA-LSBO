name: RA-LSBO PR59 selected-risk error diagnosis (pure Python, ZERO models)
on:
  push:
    paths:
      - 'ra_lsbo/experiments/risk_budget59_diagnostics.py'
      - 'tests/test_risk_budget59_diagnostics.py'
      - 'run_ra_lsbo_risk_budget59_diagnostics_pycharm.py'
      - '.github/workflows/ra-risk-budget59.yml'
  pull_request:
    paths:
      - 'ra_lsbo/experiments/risk_budget59_diagnostics.py'
      - 'tests/test_risk_budget59_diagnostics.py'
      - 'run_ra_lsbo_risk_budget59_diagnostics_pycharm.py'
      - '.github/workflows/ra-risk-budget59.yml'
jobs:
  no-new-evaluations:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_budget59_diagnostics.py tests/test_risk_budget58_protocol.py tests/test_risk_budget57_anytime_audit.py
      - run: python -m py_compile ra_lsbo/experiments/risk_budget59_diagnostics.py run_ra_lsbo_risk_budget59_diagnostics_pycharm.py
