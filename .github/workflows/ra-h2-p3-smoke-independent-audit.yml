name: RA-LSBO-H2 P3 smoke independent Release audit (no simulator)
on:
  push:
    branches:
      - analysis/h2-p3-smoke-independent-audit-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and independently audit original Windows smoke ZIP
        run: |
          python tools/audit_h2_p3_smoke_release_independent.py \
            --results-dir results/h2-p3-windows-smoke-20261102 \
            --output /tmp/RA_LSBO_H2_P3_SMOKE_INDEPENDENT_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA-H2-P3-SMOKE-INDEPENDENT-READONLY-AUDIT
          path: /tmp/RA_LSBO_H2_P3_SMOKE_INDEPENDENT_AUDIT.json
          retention-days: 90
          if-no-files-found: warn
