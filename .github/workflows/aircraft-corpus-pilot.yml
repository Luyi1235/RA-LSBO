name: Aircraft corpus candidate validation (no full pilot or MDA)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated test environment
        run: |
          mkdir -p /tmp/corpus-evidence
          git rev-parse HEAD > /tmp/corpus-evidence/commit.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
          python -m pip freeze > /tmp/corpus-evidence/environment.txt
      - name: New and affected regressions, no research evaluations
        run: |
          set -o pipefail
          python -m pytest -q tests/test_structure_corpus.py tests/test_structured_encoder.py tests/test_risk_core_mixed_gp.py tests/test_risk_core_observations.py tests/test_aircraft_corpus_protocol.py tests/test_aircraft_corpus_optimizer.py tests/test_aircraft_corpus_pilot.py --junitxml=/tmp/corpus-evidence/junit.xml 2>&1 | tee /tmp/corpus-evidence/tests.log
          python tools/verify_aircraft_corpus_tests.py /tmp/corpus-evidence/junit.xml
      - name: Bounded real smoke, maximum 42 reduced-aircraft calls
        run: |
          set -o pipefail
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot prepare --profile smoke --output runs/corpus_ci_smoke
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot run --output runs/corpus_ci_smoke --approved-call-limit 42 2>&1 | tee /tmp/corpus-evidence/smoke.log
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot audit --output runs/corpus_ci_smoke
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot report --output runs/corpus_ci_smoke
      - name: Archive exactly tested source
        if: always()
        run: git archive HEAD | gzip > /tmp/corpus-evidence/tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-closedloop-validation-${{ github.sha }}
          path: |
            /tmp/corpus-evidence/
            runs/corpus_ci_smoke/
          retention-days: 30
