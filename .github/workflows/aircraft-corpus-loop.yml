name: Aircraft corpus closed-loop validation
on:
  push:
    branches: [research/aircraft-corpus-loop-20261031]
    paths:
      - 'ra_lsbo/experiments/simplified_aircraft/corpus_*.py'
      - 'tests/test_aircraft_corpus_loop.py'
      - 'docs/AIRCRAFT_CORPUS_LOOP_PROTOCOL_20261031.md'
      - '.github/workflows/aircraft-corpus-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aircraft-corpus-loop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-models.txt
      - name: Isolated CPU dependencies
        run: |
          mkdir -p runs/aircraft_corpus_ci
          git rev-parse HEAD > runs/aircraft_corpus_ci/commit.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
          python -m pip freeze > runs/aircraft_corpus_ci/environment.txt
      - name: Integration and affected regressions; no real mission unit tests
        run: |
          set -o pipefail
          python -m pytest -q tests/test_aircraft_corpus_loop.py tests/test_structure_corpus.py tests/test_structured_encoder.py tests/test_aircraft_nominal_pilot.py tests/test_aircraft_numerical_checks.py tests/test_aircraft_transition.py tests/test_discovery_stages.py tests/test_discovery_stages_evidence.py tests/test_discovery_stages_phase.py tests/test_paper_experiments.py tests/test_soc_revision_acquisition.py tests/test_soc_revision_posterior.py tests/test_numerical_safeguards.py --junitxml=runs/aircraft_corpus_ci/junit.xml 2>&1 | tee runs/aircraft_corpus_ci/pytest.txt
      - name: Five-arm closed-loop smoke, at most 42 reduced aircraft calls
        run: |
          set -o pipefail
          folder=runs/aircraft_corpus_ci/smoke
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot prepare --profile smoke --output "$folder"
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot run --output "$folder" --approved-call-limit 42 | tee runs/aircraft_corpus_ci/smoke_console.txt
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot audit --output "$folder"
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot report --output "$folder"
      - name: Read fixed prior evidence and prepare full pilot only, zero new evaluations
        run: |
          curl --fail --location --retry 2 --output /tmp/qualification.zip 'https://github.com/Luyi1235/RA-LSBO/releases/download/aircraft-transition-20261030-1955/aircraft_entry_20261030_01_full_records.zip'
          echo 'ea1359fb7c76ea8641c54432e8e901fc4de065be6dc643590c585f6c1d7d7789  /tmp/qualification.zip' | sha256sum --check
          python -m zipfile -e /tmp/qualification.zip /tmp/aircraft-reviewed
          qualifier=$(find /tmp/aircraft-reviewed -type d -name qualification)
          test -n "$qualifier"
          curl --fail --location --retry 2 --output /tmp/corpus.zip 'https://github.com/Luyi1235/RA-LSBO/releases/download/structure-corpus-2000-20261031/RA-LSBO-structure-corpus-output-20261031_01_records.zip'
          echo 'd7953cdcc91891eff8fa0ff7c1fc1f7103ccdb7d24a39cbd94651b4ef2a2628f  /tmp/corpus.zip' | sha256sum --check
          python -m ra_lsbo.experiments.simplified_aircraft.corpus_pilot prepare --profile pilot --qualification "$qualifier" --corpus-evidence /tmp/corpus.zip --output runs/aircraft_corpus_ci/prepare_only
          test ! -e runs/aircraft_corpus_ci/prepare_only/calls.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('runs/aircraft_corpus_ci/prepare_only/plan.json').read_bytes())
          assert plan['budget']['maximum_model_calls']==2672
          assert plan['profile']['seeds']==list(range(9921,9929))
          assert plan['reviewed_offline_corpus']['archive_sha256']=='d7953cdcc91891eff8fa0ff7c1fc1f7103ccdb7d24a39cbd94651b4ef2a2628f'
          PY
      - name: Archive exact tested new sources
        if: always()
        run: |
          mkdir -p runs/aircraft_corpus_ci
          git archive HEAD ra_lsbo/experiments/simplified_aircraft/corpus_optimizer.py ra_lsbo/experiments/simplified_aircraft/corpus_audit.py ra_lsbo/experiments/simplified_aircraft/corpus_pilot.py tests/test_aircraft_corpus_loop.py docs/AIRCRAFT_CORPUS_LOOP_PROTOCOL_20261031.md .github/workflows/aircraft-corpus-loop.yml | gzip > runs/aircraft_corpus_ci/tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aircraft-corpus-loop-validation-${{ github.sha }}
          path: runs/aircraft_corpus_ci/
          retention-days: 30
