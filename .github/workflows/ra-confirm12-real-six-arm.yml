name: RA-LSBO real six-arm policy candidates (zero aircraft)
on:
  push:
    branches: [research/confirm12-real-six-arm-adapters-20261103]
  pull_request:
    paths:
      - 'confirm12/real_candidate_engines.py'
      - 'confirm12/offline_candidate_trial.py'
      - 'confirm12/offline_historical_trial.py'
      - 'confirm12/offline_ledger_trial.py'
      - 'tests/test_confirm12_real_candidate_engines.py'
      - '.github/workflows/ra-confirm12-real-six-arm.yml'
permissions:
  contents: read
jobs:
  actual-h1-derived-gp-and-vae:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      CONFIRM12_RUN_REAL_SIX_GP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen historical model requirements
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Run real H1-derived GP/VAE BO one-step and original tests, no evaluator
        run: |
          python -m pytest -q tests/test_confirm12_real_candidate_engines.py tests/test_confirm12_offline_historical_trial.py tests/test_confirm12_offline_ledger_trial.py tests/test_confirm12_structured_record_ledger.py
