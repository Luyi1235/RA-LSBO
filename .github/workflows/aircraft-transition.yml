name: Aircraft transition validation
on:
  push:
    branches: [research/aircraft-transition-20261030]
    paths:
      - 'ra_lsbo/experiments/simplified_aircraft/transition.py'
      - 'tests/test_aircraft_transition.py'
      - 'docs/AIRCRAFT_TRANSITION_PROTOCOL_20261030.md'
      - '.github/workflows/aircraft-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aircraft-transition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-models.txt
      - name: Isolated CPU test dependencies
        run: |
          mkdir -p runs/aircraft_transition_ci
          git rev-parse HEAD > runs/aircraft_transition_ci/commit.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
          python -m pip freeze > runs/aircraft_transition_ci/environment.txt
      - name: New tests and affected regressions
        run: |
          set -o pipefail
          python -m pytest -q tests/test_aircraft_transition.py tests/test_discovery_stages.py tests/test_discovery_stages_evidence.py tests/test_discovery_stages_phase.py tests/test_paper_experiments.py tests/test_soc_revision_acquisition.py tests/test_soc_revision_posterior.py tests/test_numerical_safeguards.py --junitxml=runs/aircraft_transition_ci/junit.xml 2>&1 | tee runs/aircraft_transition_ci/pytest.txt
      - name: Six-method nominal aircraft interface smoke (36 calls)
        run: |
          folder=runs/aircraft_transition_ci/smoke
          python -m ra_lsbo.experiments.simplified_aircraft.transition prepare --stage smoke --output "$folder"
          python -m ra_lsbo.experiments.simplified_aircraft.transition run --output "$folder" --approved-call-limit 36
          python -m ra_lsbo.experiments.simplified_aircraft.transition audit --output "$folder"
          python -m ra_lsbo.experiments.simplified_aircraft.transition report --output "$folder"
      - name: Small qualification execution (64 calls, not full 316-call qualification)
        run: |
          folder=runs/aircraft_transition_ci/qualification_ci
          python -m ra_lsbo.experiments.simplified_aircraft.transition prepare --stage qualification --size ci --output "$folder"
          python -m ra_lsbo.experiments.simplified_aircraft.transition run --output "$folder" --approved-call-limit 64
          python -m ra_lsbo.experiments.simplified_aircraft.transition audit --output "$folder"
          python -m ra_lsbo.experiments.simplified_aircraft.transition report --output "$folder"
      - name: Prepare-only local-size plan (zero further evaluations)
        run: |
          python -m ra_lsbo.experiments.simplified_aircraft.transition prepare --stage qualification --size full --output runs/aircraft_transition_ci/prepare_only
          test ! -e runs/aircraft_transition_ci/prepare_only/calls.jsonl
      - name: Archive tracked source identity, no generated runs or credentials
        if: always()
        run: |
          mkdir -p runs/aircraft_transition_ci
          git archive HEAD ra_lsbo/experiments/simplified_aircraft/transition.py tests/test_aircraft_transition.py docs/AIRCRAFT_TRANSITION_PROTOCOL_20261030.md | gzip > runs/aircraft_transition_ci/tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aircraft-transition-${{ github.sha }}
          retention-days: 30
          path: runs/aircraft_transition_ci/
