name: risk-learnability-phase-a
on:
  pull_request:
    paths:
      - 'risk_learning/**'
      - 'run_risk_learnability.py'
      - 'check_risk_learning_evidence.py'
      - 'tests/*risk_learning*'
      - 'RESEARCH_DIRECTION.md'
      - 'docs/RISK_LEARNABILITY_PHASE_A.txt'
      - '.github/workflows/risk-learnability.yml'
permissions:
  contents: read
jobs:
  supervised-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: code
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Dependency-free contracts and task construction
        run: python -S -m unittest discover -s tests -p test_risk_learning_core.py -v
      - name: Temporary CI dependencies only
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Native EP and historical evaluator/feature parity
        run: python -m unittest discover -s tests -p test_risk_learning_native.py -v
      - name: Syntax and dependency-free entrypoints
        run: |
          python -m compileall -q risk_learning run_risk_learnability.py
          python -S run_risk_learnability.py --help
          python -S run_risk_learnability.py --task plan --profile full
      - name: Actual supervised integration (176 mathematical calls; not online BO)
        run: python run_risk_learnability.py --task run --profile ci --expected-sha "${{ github.event.pull_request.head.sha }}" --output "${{ runner.temp }}/risk-learning-evidence/ci"
      - name: Model-free ledger, paired metrics, leakage and resealed-tamper checks
        run: |
          python -S run_risk_learnability.py --task verify --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/risk-learning-evidence/ci"
          python -S check_risk_learning_evidence.py --input "${{ runner.temp }}/risk-learning-evidence/ci"
      - name: Save raw evidence including failure bills
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: risk-learning-${{ matrix.os }}
          path: ${{ runner.temp }}/risk-learning-evidence
          if-no-files-found: ignore
