name: RA-LSBO-H2 independent sealed P1 review (zero simulator)
on:
  push:
    branches:
      - analysis/h2-p1-independent-sealed-audit-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original Windows Release ZIP and PR results without a model import
        run: |
          python tools/audit_h2_p1_release_independent.py \
            --results results/h2-p1-smoke-20261102 \
            --output /tmp/ra-h2-p1-independent-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA-H2-P1-READONLY-SEALED-VALIDATION
          path: /tmp/ra-h2-p1-independent-audit.json
          retention-days: 90
          if-no-files-found: warn
