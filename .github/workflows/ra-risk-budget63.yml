name: RA-LSBO PR63 candidate-local credible soft value (no physical evals in CI)
on:
  push:
    paths:
      - 'ra_lsbo/experiments/risk_budget63_local_value_policy.py'
      - 'ra_lsbo/experiments/risk_budget63_local_value_engine.py'
      - 'ra_lsbo/experiments/risk_budget63_protocol.py'
      - 'ra_lsbo/experiments/risk_budget63_runner.py'
      - 'tests/test_risk_budget63_local_value_policy.py'
      - 'tests/test_risk_budget63_protocol.py'
      - 'run_ra_lsbo_risk_budget63_local_value_pycharm.py'
      - '.github/workflows/ra-risk-budget63.yml'
  pull_request:
    paths:
      - 'ra_lsbo/experiments/risk_budget63_local_value_policy.py'
      - 'ra_lsbo/experiments/risk_budget63_local_value_engine.py'
      - 'ra_lsbo/experiments/risk_budget63_protocol.py'
      - 'ra_lsbo/experiments/risk_budget63_runner.py'
      - 'tests/test_risk_budget63_local_value_policy.py'
      - 'tests/test_risk_budget63_protocol.py'
      - 'run_ra_lsbo_risk_budget63_local_value_pycharm.py'
      - '.github/workflows/ra-risk-budget63.yml'
jobs:
  pure-candidate-credibility:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_risk_budget63_local_value_policy.py tests/test_risk_budget63_protocol.py tests/test_risk_budget54_policy.py
      - run: python -m py_compile ra_lsbo/experiments/risk_budget63_local_value_policy.py ra_lsbo/experiments/risk_budget63_local_value_engine.py ra_lsbo/experiments/risk_budget63_protocol.py ra_lsbo/experiments/risk_budget63_runner.py run_ra_lsbo_risk_budget63_local_value_pycharm.py
