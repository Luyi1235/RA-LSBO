name: Opt-in EP tail stability candidate tests

on:
  push:
    branches:
      - research/ep-stability-candidate-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned numerical dependencies (no aircraft evaluator invoked)
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Numerical tests and existing mixed EP regressions
        run: |
          python -m py_compile ra_lsbo/risk_core/ep_numerics.py ra_lsbo/risk_core/mixed_gp.py
          python -m pytest -q tests/test_ep_stability_candidate.py tests/test_risk_core_mixed_gp.py tests/test_risk_core_observations.py --junitxml=ep_stability_junit.xml
      - name: Preserve JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-stability-candidate-tests
          path: ep_stability_junit.xml
          retention-days: 30
          if-no-files-found: warn
