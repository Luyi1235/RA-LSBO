name: RA-LSBO GP 12-192 sample learning curve (ZERO aircraft)
on:
  push:
    branches: [research/ra-lsbo-sample-size-learning-curves-20261104]
  pull_request:
    paths:
      - 'confirm12/sample_size_gp_learning.py'
      - 'run_ra_lsbo_gp_learning_curve_pycharm.py'
      - 'tests/test_confirm12_sample_size_gp_learning.py'
      - '.github/workflows/ra-confirm12-sample-size.yml'
permissions:
  contents: read
jobs:
  real-vae-gp-offline-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      RA_SAMPLE_SIZE_GP_REAL_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Test frozen qA folds and real VAE/GP 24-record fit without aircraft
        run: |
          python -m pytest -q tests/test_confirm12_sample_size_gp_learning.py
      - name: Import one-click PyCharm launcher without evaluating aircraft
        run: |
          python -c "import runpy; runpy.run_path('run_ra_lsbo_gp_learning_curve_pycharm.py',run_name='__import_only__')"
