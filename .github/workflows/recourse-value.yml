name: observable-recourse-value
on:
  pull_request:
    paths:
      - 'recourse_value_*.py'
      - 'run_recourse_value_pilot.py'
      - 'tests/test_recourse_*.py'
      - 'docs/RECOURSE_VALUE_PILOT.txt'
      - '.github/workflows/recourse-value.yml'
permissions:
  contents: read
jobs:
  actual-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Temporary CI dependencies only
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Standard-library scenario and protocol tests
        run: python -S -m unittest discover -s tests -p test_recourse_core.py -v
      - name: Actual EP parity, feedback and raw-vector integrity tests
        run: python -m unittest discover -s tests -p test_recourse_runtime.py -v
      - name: Syntax and dependency-free help
        run: |
          python -m compileall -q recourse_value_core.py recourse_value_protocol.py recourse_value_engine.py run_recourse_value_pilot.py
          python -S run_recourse_value_pilot.py --help
      - name: Four-arm actual online integration (40 true mathematical calls)
        run: python run_recourse_value_pilot.py --profile ci --expected-sha "${{ github.event.pull_request.head.sha }}" --output "${{ runner.temp }}/recourse-ci"
      - name: Model-free raw evidence reconciliation
        run: python -S run_recourse_value_pilot.py --task verify --input "${{ runner.temp }}/recourse-ci"
      - name: Preserve all raw evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recourse-value-${{ matrix.os }}
          path: ${{ runner.temp }}/recourse-ci
          if-no-files-found: ignore
