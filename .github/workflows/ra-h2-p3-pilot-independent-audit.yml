name: RA-LSBO H2 P3 independent pilot Release audit (zero simulator)
on:
  push:
    branches: [analysis/h2-p3-pilot-independent-audit-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned lightweight SOC interval scoring
        run: |
          python -m pip install scipy==1.13.1 numpy==2.0.2
          python -m pip check
      - name: Independently download original 50 MB Release and audit all 800 calls
        run: |
          python tools/audit_h2_p3_pilot_release_independent.py \
            --results-dir results/h2-p3-windows-pilot-20261103 \
            --output /tmp/RA_LSBO_H2_P3_PILOT_INDEPENDENT_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA-H2-P3-INDEPENDENT-SEALED-RAW-AUDIT
          path: /tmp/RA_LSBO_H2_P3_PILOT_INDEPENDENT_AUDIT.json
          retention-days: 90
          if-no-files-found: warn
