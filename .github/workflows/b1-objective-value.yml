name: phase-b1-objective-value
on:
  pull_request:
    paths:
      - 'b1_*.py'
      - 'run_objective_risk_value.py'
      - 'check_b1_evidence.py'
      - 'tests/test_b1_*.py'
      - 'docs/PHASE_B1_OBJECTIVE_VALUE.txt'
      - '.github/workflows/b1-objective-value.yml'
permissions:
  contents: read
jobs:
  actual-shared-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Pure protocol tests and unchanged legacy tree
        run: |
          python -S -m unittest discover -s tests -p test_b1_core.py -v
          python -S -c "import subprocess; assert not subprocess.check_output(['git','diff','--name-only','634ff13c07d11e4df4748199806726a3eb14fd70','HEAD','--','ra_lsbo','risk_learning','decision_value_core.py','run_frozen_risk_decisions.py']).strip()"
      - name: Temporary CI model dependencies only
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt
      - name: Shared native GP, missing labels and no-leakage regression tests
        run: python -m unittest discover -s tests -p test_b1_native.py -v
      - name: Compile and safe entrypoints
        run: |
          python -m compileall -q b1_core.py b1_native.py b1_study.py b1_verify.py run_objective_risk_value.py check_b1_evidence.py
          python -S run_objective_risk_value.py --help
          python -S run_objective_risk_value.py --task plan --profile full
      - name: Actual new-data fixed-policy integration (160 mathematical calls)
        run: python run_objective_risk_value.py --task run --profile ci --expected-sha "${{ github.event.pull_request.head.sha }}" --output "${{ runner.temp }}/b1-evidence/ci"
      - name: Model-free reconstruction and resealed tamper tests
        run: |
          python -S run_objective_risk_value.py --task verify --expected-sha "${{ github.event.pull_request.head.sha }}" --input "${{ runner.temp }}/b1-evidence/ci"
          python -S check_b1_evidence.py --input "${{ runner.temp }}/b1-evidence/ci"
      - name: Preserve complete evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-b1-${{ matrix.os }}
          path: ${{ runner.temp }}/b1-evidence
          if-no-files-found: ignore
  cross-python-verifier:
    needs: actual-shared-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase-b1-windows-latest
          path: evidence
      - name: Verify Python 3.9 Windows evidence with Python 3.13, no models
        run: python -S run_objective_risk_value.py --task verify --expected-sha "${{ github.event.pull_request.head.sha }}" --input evidence/ci
