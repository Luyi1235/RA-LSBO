name: RA-LSBO H2 P5 zero-aircraft replay tests
on:
  push:
    branches: [research/h2-p5-single-step-intervention-replay-20261103]
  pull_request:
    branches: [analysis/h2-p4-decision-sensitivity-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-truth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-models.txt pytest==8.3.5
      - run: python -m pip check
      - run: python -m pytest -q tests/test_h2_p5_full_path.py tests/test_h2_p4_decision_sensitivity.py tests/test_h2_risk_controller.py tests/test_h2_metrics.py tests/test_h2_p3_ablation.py
