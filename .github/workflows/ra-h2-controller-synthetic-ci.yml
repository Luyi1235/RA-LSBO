name: RA-LSBO-H2 causal risk controller and censored synthetic benchmark
on:
  push:
    branches:
      - research/ra-lsbo-h2-causal-risk-20261102
    paths:
      - ra_lsbo/experiments/simplified_aircraft/h2_*.py
      - tests/test_h2_*.py
      - tools/run_h2_hierarchical_synthetic.py
      - .github/workflows/ra-h2-controller-synthetic-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: 'Agg'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original research dependencies (CPU only)
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt pytest==8.3.5
          python -m pip check
      - name: Test no-leakage state, proper interval scoring and original GP/acquisition regressions
        run: |
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/h2_risk_controller.py
          python -m py_compile ra_lsbo/experiments/simplified_aircraft/h2_optimizer.py
          python -m py_compile tools/run_h2_hierarchical_synthetic.py
          python -m pytest -q tests/test_h2_risk_controller.py tests/test_h2_optimizer_integration.py tests/test_aircraft_dualview.py tests/test_risk_core_observations.py --junitxml=/tmp/h2-test-results.xml
      - name: Execute declared analytic hierarchical mixed-variable and censoring streams
        run: |
          python tools/run_h2_hierarchical_synthetic.py --output /tmp/h2-synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-causal-hierarchical-censored-benchmark
          path: |
            /tmp/h2-synthetic/
            /tmp/h2-test-results.xml
          retention-days: 60
          if-no-files-found: warn
