name: information-value-stage2
on:
  pull_request:
    paths:
      - 'ra_lsbo/experiments/information_value_stage2/**'
      - 'tests/test_information_value_stage2*.py'
      - 'run_ra_lsbo_information_stage2_pycharm.py'
      - '.github/workflows/information-value-stage2.yml'
jobs:
  pure-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Original protocol tests
        run: python -m unittest discover -s tests -p test_information_value_stage2.py -v
      - name: Repository relative import paths (no scientific imports)
        run: python -m unittest discover -s tests -p test_information_value_stage2_import_paths.py -v
      - name: Compile stage 2 source
        run: python -m compileall -q ra_lsbo/experiments/information_value_stage2 run_ra_lsbo_information_stage2_pycharm.py
  real-runtime-imports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install CI-only CPU scientific import dependencies
        run: |
          python -m pip install numpy==2.0.2 scipy==1.13.1 scikit-learn==1.6.1 matplotlib==3.9.4
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Real engine, runner and CLI imports (no GP fits or evaluations)
        run: python -m unittest discover -s tests -p test_information_value_stage2_runtime_imports.py -v
      - name: Full PR67 regression set
        run: python -m unittest discover -s tests -p "test_information_value_stage2*.py" -v
