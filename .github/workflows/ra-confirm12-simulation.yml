name: Confirmation 12 worker synthetic-only tests
on:
  pull_request:
    paths:
      - 'confirm12/**'
      - 'run_ra_lsbo_confirm_12workers.py'
      - 'tests/test_confirm12.py'
      - '.github/workflows/ra-confirm12-simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - run: python -m pytest -q tests/test_confirm12.py tests/test_confirm12_call_ledger.py tests/test_confirm12_qualification.py tests/test_confirm12_adapters.py tests/test_confirm12_ledger_simulation.py tests/test_confirm12_design.py
