name: Research regression (no MDA)

on:
  push:
    branches: [fix/comparison-integrity-20261028]
  pull_request:
    paths:
      - 'ra_lsbo/**'
      - 'tests/**'
      - 'requirements-models.txt'
      - '.github/workflows/research-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source (no untracked runs or credentials)
        run: |
          mkdir -p /tmp/ra-regression-evidence
          git rev-parse HEAD > /tmp/ra-regression-evidence/commit.txt
          git archive HEAD | gzip > /tmp/ra-regression-evidence/source.tar.gz
      - name: Upload source identity
        uses: actions/upload-artifact@v4
        with:
          name: regression-source-${{ github.sha }}
          path: /tmp/ra-regression-evidence/
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-models.txt 'pytest==8.3.5'
          python -m pip check
          python -m pip freeze > /tmp/ra-regression-evidence/environment.txt
      - name: Run comparison and posterior regression tests, not campaigns
        run: |
          set -o pipefail
          python -m pytest -q tests/test_external_comparison.py tests/test_comparison_entrypoints.py tests/test_comparison_visualization.py tests/test_paper_experiments.py tests/test_soc_revision.py --junitxml=/tmp/ra-regression-evidence/junit.xml 2>&1 | tee /tmp/ra-regression-evidence/pytest.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ github.sha }}
          path: |
            /tmp/ra-regression-evidence/commit.txt
            /tmp/ra-regression-evidence/environment.txt
            /tmp/ra-regression-evidence/junit.xml
            /tmp/ra-regression-evidence/pytest.txt
          retention-days: 14
